<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #f4f4f9; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
    .card { background: white; padding: 0.5rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; display: block; }
    p { margin: 0.5rem 0 0; font-size: 0.9rem; color: #333; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Repository Images</h1>
  <div class="gallery" id="gallery">Loading images...</div>

  <script>
    // REPLACE THESE THREE VALUES WITH YOUR DETAILS
    const username = 'YOUR_GITHUB_USERNAME';
    const repo = 'YOUR_REPOSITORY_NAME';
    const folderPath = ''; // Leave empty for root folder, or use e.g. 'images'

    async function loadImages() {
      const url = `https://github.com{username}/${repo}/contents/${folderPath}`;
      const response = await fetch(url);
      const files = await response.json();
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';

      files
        .filter(file => /\.(jpe?g)$/i.test(file.name))
        .forEach(file => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <a href="${file.download_url}" target="_blank">
              <img src="${file.download_url}" alt="${file.name}" loading="lazy">
            </a>
            <p>${file.name}</p>
          `;
          gallery.appendChild(card);
        });
    }
    loadImages();
  </script>
</body>
</html>
